
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="Connect with Algorix Digital. Follow us and get in touch.">

  <title>Algorix Digital | Connect With Us</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 18px;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background: radial-gradient(
        ellipse at top,
        #303030 0%,
        #101010 58%
      );
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      margin: 0 auto;
    }

    /* ALG0RIX DIGITAL LOGO */
    .logo {
      width: 100%;
      max-width: 300px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    h1 {
      font-size: 27px;
      margin: 0 0 10px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #bdbdbd;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 28px;
    }

    .links {
      display: grid;
      gap: 13px;
    }

    .link {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 17px 18px;
      border: 1px solid #414141;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.07);
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }

    .link:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .symbol {
      font-size: 21px;
      width: 27px;
      flex-shrink: 0;
    }

    .arrow {
      margin-left: auto;
      color: #aaa;
      font-size: 19px;
    }

    .footer {
      color: #8d8d8d;
      font-size: 12px;
      margin-top: 30px;
      line-height: 1.7;
    }

    .footer a {
      color: #1680ff;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 360px) {
      body {
        padding: 28px 14px;
      }

      .logo {
        max-width: 250px;
      }

      h1 {
        font-size: 24px;
      }

      .link {
        padding: 15px 12px;
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .link {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- ALG0RIX DIGITAL LOGO -->
    <div class="logo">
      <img src="./logo.png" alt="Algorix Digital logo">
    </div>

    <h1>Algorix Digital</h1>

    <p class="subtitle">
      Thanks for connecting with us.<br>
      Choose an option below to get started.
    </p>

    <nav class="links" aria-label="Social media and contact links">

      <!-- GOOGLE REVIEWS: Replace with your direct review URL -->
      <a class="link"
         href="https://https://www.google.com/maps/place/Coffeemistry/@33.7067154,73.0350744,17z/data=!3m1!4b1!4m6!3m5!1s0x38dfbf7c7df4708b:0x145a43ec91be143!8m2!3d33.7067154!4d73.0376493!16s%2Fg%2F11ltlcwptk?entry=ttu&g_ep=EgoyMDI2MTAwNy4wIKXMDSoASAFQAw%3D%3D/"
         target="_blank"
         rel="noopener noreferrer">
        <span class="symbol">★</span>
        <span>Leave a Google Review</span>
        <span class="arrow">↗</span>
      </a>

      <!-- INSTAGRAM: Replace with your profile URL -->
      <a class="link"
         href="https://https://www.instagram.com/algorixdigital/"
         target="_blank"
         rel="noopener noreferrer">
        <span class="symbol">◎</span>
        <span>Follow Us on Instagram</span>
        <span class="arrow">↗</span>
      </a>

      <!-- WHATSAPP: Replace with your business number -->
      <a class="link"
         href="https://wa.me/923001234567"
         target="_blank"
         rel="noopener noreferrer">
        <span class="symbol">☏</span>
        <span>Contact Us on WhatsApp</span>
        <span class="arrow">↗</span>
      </a>

      <!-- FACEBOOK: Replace with your page URL -->
      <a class="link"
         href="https://www.facebook.com/profile.php?id=61594949199879/"
         target="_blank"
         rel="noopener noreferrer">
        <span class="symbol">f</span>
        <span>Follow Us on Facebook</span>
        <span class="arrow">↗</span>
      </a>

    </nav>

    <p class="footer">
      Thank you for your support.<br>
      Powered by
      <a href="https://algorixdigital.github.io/">
        Algorix Digital
      </a>
    </p>

  </main>
</body>
</html>
