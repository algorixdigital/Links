
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="Connect with us, follow us, and share your experience.">
  <title>Connect With Us</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 18px;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(ellipse at top, #303030 0%, #101010 58%);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      width: 86px;
      height: 86px;
      margin: 0 auto 20px;
      border: 1px solid #555;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #202020;
      font-size: 34px;
    }

    h1 {
      font-size: 27px;
      margin: 0 0 10px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #bdbdbd;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 28px;
    }

    .links {
      display: grid;
      gap: 13px;
    }

    .link {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 17px 18px;
      border: 1px solid #414141;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.07);
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }

    .link:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .symbol {
      font-size: 21px;
      width: 27px;
    }

    .arrow {
      margin-left: auto;
      color: #aaa;
      font-size: 19px;
    }

    .footer {
      color: #8d8d8d;
      font-size: 12px;
      margin-top: 30px;
      line-height: 1.7;
    }

    .footer a {
      color: #cccccc;
    }

    @media (prefers-reduced-motion: reduce) {
      .link {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="logo" aria-hidden="true">⌁</div>

    <!-- CHANGE YOUR BUSINESS NAME BELOW -->
    <h1>Your Business Name</h1>
    <p class="subtitle">
      Thanks for connecting with us.<br>
      Choose an option below to get started.
    </p>

    <nav class="links" aria-label="Our links">

      <!-- Replace each example URL with your real link -->

      <a class="link"
         href="https://www.google.com/"
         target="_blank" rel="noopener noreferrer">
        <span class="symbol">★</span>
        <span>Leave a Google Review</span>
        <span class="arrow">↗</span>
      </a>

      <a class="link"
         href="https://www.instagram.com/"
         target="_blank" rel="noopener noreferrer">
        <span class="symbol">◎</span>
        <span>Follow Us on Instagram</span>
        <span class="arrow">↗</span>
      </a>

      <a class="link"
         href="https://wa.me/923001234567"
         target="_blank" rel="noopener noreferrer">
        <span class="symbol">◉</span>
        <span>Chat on WhatsApp</span>
        <span class="arrow">↗</span>
      </a>

      <a class="link"
         href="https://www.facebook.com/"
         target="_blank" rel="noopener noreferrer">
        <span class="symbol">f</span>
        <span>Follow Us on Facebook</span>
        <span class="arrow">↗</span>
      </a>

    </nav>

    <p class="footer">
      Thank you for your support.<br>
      Powered by <a href="https://algorixdigital.github.io/">
      Algorix Digital</a>
    </p>

  </main>
</body>
</html>
