
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algorix Digital | Connect With Us</title>

  <!-- Font Awesome Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    .social-container {
      text-align: center;
      padding: 30px 20px;
    }

    h1 {
      color: #172033;
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #667085;
      margin-bottom: 30px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
    }

    .social-link {
      width: 85px;
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: white;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
      text-decoration: none;
      font-size: 36px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .social-link:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.13);
    }

    .instagram {
      color: #E1306C;
    }

    .facebook {
      color: #1877F2;
    }

    .google {
      color: #4285F4;
    }

    .website {
      color: #172033;
    }

    .label {
      margin-top: 10px;
      font-size: 13px;
      color: #344054;
      font-weight: 600;
    }

    .social-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>

<body>
  <main class="social-container">
    <h1>Algorix Digital</h1>
    <p>Connect with us online</p>

    <div class="social-links">

      <!-- Instagram -->
      <div class="social-item">
        <a
          class="social-link instagram"
          href="https://www.instagram.com/algorixdigital"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <i class="fa-brands fa-instagram"></i>
        </a>
        <span class="label">Instagram</span>
      </div>

      <!-- Facebook -->
      <div class="social-item">
        <a
          class="social-link facebook"
          href="#"
          aria-label="Facebook link not added yet"
          onclick="event.preventDefault()"
        >
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <span class="label">Facebook</span>
      </div>

      <!-- Google Reviews -->
      <div class="social-item">
        <a
          class="social-link google"
          href="#"
          aria-label="Google Reviews link not added yet"
          onclick="event.preventDefault()"
        >
          <i class="fa-brands fa-google"></i>
        </a>
        <span class="label">Google Reviews</span>
      </div>

      <!-- Website -->
      <div class="social-item">
        <a
          class="social-link website"
          href="#"
          aria-label="Website link not added yet"
          onclick="event.preventDefault()"
        >
          <i class="fa-solid fa-globe"></i>
        </a>
        <span class="label">Website</span>
      </div>

    </div>
  </main>
</body>
</html>
